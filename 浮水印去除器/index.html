<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 浮水印去除器 (Web 版)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); }
        h1 { margin-bottom: 0.5rem; font-weight: 600; letter-spacing: -0.025em; text-align: center; }
        p.subtitle { color: var(--text-muted); margin-bottom: 2rem; text-align: center; }
        
        .container { width: 100%; max-width: 900px; background: var(--panel-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 1rem; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        /* Upload Area */
        .upload-area { border: 2px dashed var(--border-color); border-radius: 0.75rem; padding: 3rem 2rem; text-align: center; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; }
        .upload-area:hover, .upload-area.dragover { border-color: var(--accent-color); background: rgba(59, 130, 246, 0.05); }
        .upload-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.8; }
        #fileInput { display: none; }
        
        /* Workspace (Preview & Controls) */
        .workspace { display: none; flex-direction: column; gap: 1.5rem; }
        .preview-container { position: relative; width: 100%; border-radius: 0.5rem; overflow: hidden; background: #000; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); display: flex; justify-content: center; align-items: center; min-height: 300px;}
        canvas { max-width: 100%; max-height: 60vh; object-fit: contain; display: block; }
        
        .controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color); }
        .btn { background: var(--accent-color); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: background 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
        
        .options { display: flex; gap: 1rem; align-items: center; }
        select { background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--border-color); padding: 0.5rem; border-radius: 0.25rem; outline: none; }
        
        /* Loading Overlay */
        .loading { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; color: white; font-size: 1.2rem; display: none; z-index: 10; backdrop-filter: blur(4px); }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Slider */
        .slider-container { position: relative; width: 100%; max-width: 300px; display: flex; align-items: center; gap: 1rem; }
        .slider-container label { font-size: 0.9rem; color: var(--text-muted); white-space: nowrap; }
        input[type=range] { flex: 1; accent-color: var(--accent-color); }
        
        @media (max-width: 600px) {
            .controls { flex-direction: column; align-items: stretch; }
            .options { flex-direction: column; align-items: stretch; }
            .slider-container { max-width: 100%; }
        }
    </style>
</head>
<body>

    <h1>Gemini 浮水印去除器</h1>
    <p class="subtitle">100% 本地端處理，讓你的畫面乾乾淨淨</p>

    <div class="container">
        <!-- Upload State -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📥</div>
            <h2>點擊或拖放圖片至此 (支援多選)</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">支援 JPG, PNG, WebP (處理在瀏覽器本地完成，保護隱私)</p>
            <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp, image/bmp" multiple>
        </div>

        <!-- Workspace State -->
        <div class="workspace" id="workspace">
            <div class="preview-container">
                <canvas id="imageCanvas"></canvas>
                <div class="loading" id="loadingOverlay">
                    <div class="spinner"></div>
                    <span>處理中...</span>
                </div>
            </div>
            
            <div class="gallery-controls" id="galleryControls" style="display: none; justify-content: center; align-items: center; gap: 1rem; margin-top: 0.5rem;">
                <button class="btn btn-secondary" id="btnPrev" style="padding: 0.5rem 1rem;">◀ 上一張</button>
                <span id="galleryCounter" style="color: var(--text-muted); font-size: 0.95rem; font-weight: 500;">1 / 1</span>
                <button class="btn btn-secondary" id="btnNext" style="padding: 0.5rem 1rem;">下一張 ▶</button>
            </div>
            
            <div class="slider-container">
                <label>對比 (Before/After)</label>
                <input type="range" id="compareSlider" min="0" max="100" value="100">
            </div>

            <div class="watermark-controls" style="display: flex; gap: 1rem; align-items: center; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 0.5rem; flex-wrap: wrap;">
                <label style="font-size: 0.9rem; color: var(--text-muted);">自訂浮水印:</label>
                <input type="file" id="customWatermarkInput" accept="image/png, image/jpeg, image/webp" style="display: none;">
                <button class="btn btn-secondary" id="btnCustomWatermark" style="padding: 0.5rem 1rem; font-size: 0.85rem;">📁 選擇圖片</button>
                <span id="customWatermarkName" style="color: var(--text-main); font-size: 0.85rem; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">(無)</span>
                <button class="btn btn-secondary" id="btnClearWatermark" style="padding: 0.4rem; display: none; font-size: 0.8rem;">❌</button>
                
                <div style="display: flex; gap: 1rem; margin-left: auto; flex-wrap: wrap; align-items: center;">
                    <label style="font-size: 0.9rem; color: var(--text-muted);">位置:</label>
                    <select id="customWatermarkPosition" style="padding: 0.3rem;">
                        <option value="bottom-right">右下</option>
                        <option value="bottom-left">左下</option>
                        <option value="top-right">右上</option>
                        <option value="top-left">左上</option>
                        <option value="center">置中</option>
                    </select>
                    <label style="font-size: 0.9rem; color: var(--text-muted);">大小:</label>
                    <input type="range" id="customWatermarkSize" min="5" max="100" value="15" style="max-width: 80px;">
                    <label style="font-size: 0.9rem; color: var(--text-muted);">透明度:</label>
                    <input type="range" id="customWatermarkOpacity" min="10" max="100" value="100" style="max-width: 80px;">
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" id="btnReset">🔄 重新上傳</button>
                <div class="options">
                    <label style="font-size: 0.9rem; color: var(--text-muted);">輸出格式:</label>
                    <select id="formatSelect">
                        <option value="image/png">PNG (無損)</option>
                        <option value="image/jpeg">JPEG (高畫質)</option>
                        <option value="image/webp">WebP</option>
                    </select>
                    <button class="btn btn-secondary" id="btnDownloadAll" style="display: none;">📦 下載全部</button>
                    <button class="btn" id="btnDownload">💾 下載目前圖片</button>
                </div>
            </div>
        </div>
    </div>

                        const canvas = document.createElement('canvas');
                        canvas.width = size;
                        canvas.height = size;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        const data = ctx.getImageData(0, 0, size, size).data;
                        const alphaMap = new Float32Array(size * size);
                        for (let i = 0; i < size * size; i++) {
                            // alpha = max(R, G, B) / 255
                            const r = data[i * 4];
                            const g = data[i * 4 + 1];
                            const b = data[i * 4 + 2];
                            alphaMap[i] = Math.max(r, g, b) / 255.0;
                        }
                        resolve(alphaMap);
                    };
                    img.src = 'data:image/png;base64,' + base64Str;
                });
            }

            process(imageData) {
                const w = imageData.width;
                const h = imageData.height;
                let size = 48;
                let margin = 32;
                let alphaMap = this.alpha48;

                if (w > 1024 && h > 1024) {
                    size = 96;
                    margin = 64;
                    alphaMap = this.alpha96;
                }

                const startX = w - margin - size;
                const startY = h - margin - size;
                const pixels = imageData.data;
                const logoValue = 255.0;

                for (let row = 0; row < size; row++) {
                    for (let col = 0; col < size; col++) {
                        const alpha = alphaMap[row * size + col];
                        if (alpha < 0.002) continue; // Skip if no watermark influence

                        const a = Math.min(alpha, 0.99); // Prevent division by zero
                        const oneMinusA = 1.0 - a;

                        const px = startX + col;
                        const py = startY + row;
                        
                        if (px < 0 || px >= w || py < 0 || py >= h) continue;

                        const idx = (py * w + px) * 4;

                        // Reverse Alpha Blending: original = (watermarked - alpha * logo) / (1 - alpha)
                        for (let c = 0; c < 3; c++) {
                            const watermarked = pixels[idx + c];
                            const original = (watermarked - a * logoValue) / oneMinusA;
                            pixels[idx + c] = Math.max(0, Math.min(255, Math.round(original)));
                        }
                    }
                }
                return imageData;
            }
        }

        // --- 3. App Logic & UI ---
        document.addEventListener('DOMContentLoaded', async () => {
            const engine = new WatermarkEngine();
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const workspace = document.getElementById('workspace');
            const canvas = document.getElementById('imageCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const btnReset = document.getElementById('btnReset');
            const btnDownload = document.getElementById('btnDownload');
            const btnDownloadAll = document.getElementById('btnDownloadAll');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const compareSlider = document.getElementById('compareSlider');
            const formatSelect = document.getElementById('formatSelect');
            const galleryControls = document.getElementById('galleryControls');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const galleryCounter = document.getElementById('galleryCounter');

            // Custom Watermark Elements
            const customWatermarkInput = document.getElementById('customWatermarkInput');
            const btnCustomWatermark = document.getElementById('btnCustomWatermark');
            const customWatermarkName = document.getElementById('customWatermarkName');
            const btnClearWatermark = document.getElementById('btnClearWatermark');
            const customWatermarkPosition = document.getElementById('customWatermarkPosition');
            const customWatermarkSize = document.getElementById('customWatermarkSize');
            const customWatermarkOpacity = document.getElementById('customWatermarkOpacity');

            let filesQueue = [];
            let currentFileIndex = 0;
            let originalImage = null;
            let processedImageData = null;
            let originalImageData = null;
            let currentFilename = 'image.png';
            let customWatermarkImg = null;

            // Initialize Engine
            await engine.init();

            // Prevent default drag behaviors for the entire window to avoid accidental navigation
            window.addEventListener('dragover', (e) => e.preventDefault(), false);
            window.addEventListener('drop', (e) => e.preventDefault(), false);

            // Setup Drag & Drop
            uploadArea.addEventListener('click', () => fileInput.click());
            uploadArea.addEventListener('dragenter', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
            uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
            uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFiles(e.dataTransfer.files);
                }
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) handleFiles(e.target.files);
            });

            function handleFiles(files) {
                const validFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
                if (validFiles.length === 0) {
                    alert('請上傳圖片檔案！');
                    return;
                }
                filesQueue = validFiles;
                currentFileIndex = 0;
                
                if (filesQueue.length > 1) {
                    galleryControls.style.display = 'flex';
                    btnDownloadAll.style.display = 'inline-flex';
                } else {
                    galleryControls.style.display = 'none';
                    btnDownloadAll.style.display = 'none';
                }
                
                loadFile(currentFileIndex);
            }

            function loadFile(index) {
                const file = filesQueue[index];
                galleryCounter.textContent = `${index + 1} / ${filesQueue.length}`;
                btnPrev.disabled = index === 0;
                btnNext.disabled = index === filesQueue.length - 1;
                
                currentFilename = file.name.replace(/\.[^/.]+$/, ""); // remove extension
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        originalImage = img;
                        startProcessing();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
            
            btnPrev.addEventListener('click', () => {
                if (currentFileIndex > 0) {
                    currentFileIndex--;
                    loadFile(currentFileIndex);
                }
            });
            
            btnNext.addEventListener('click', () => {
                if (currentFileIndex < filesQueue.length - 1) {
                    currentFileIndex++;
                    loadFile(currentFileIndex);
                }
            });

            function startProcessing() {
                uploadArea.style.display = 'none';
                workspace.style.display = 'flex';
                loadingOverlay.style.display = 'flex';
                
                canvas.width = originalImage.width;
                canvas.height = originalImage.height;
                ctx.drawImage(originalImage, 0, 0);
                
                originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                compareSlider.value = 100;

                // Use requestAnimationFrame to allow UI to update loading state before blocking thread
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        try {
                            const dataToProcess = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            let pData = engine.process(dataToProcess);
                            
                            if (customWatermarkImg) {
                                const tempCanvas = document.createElement('canvas');
                                tempCanvas.width = canvas.width;
                                tempCanvas.height = canvas.height;
                                const tempCtx = tempCanvas.getContext('2d');
                                tempCtx.putImageData(pData, 0, 0);
                                applyCustomWatermark(tempCtx, canvas.width, canvas.height);
                                pData = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
                            }
                            
                            processedImageData = pData;
                            ctx.putImageData(processedImageData, 0, 0);
                        } catch (err) {
                            alert('處理圖片時發生錯誤');
                            console.error(err);
                        } finally {
                            loadingOverlay.style.display = 'none';
                        }
                    });
                });
            }

            // Before/After Slider
            compareSlider.addEventListener('input', (e) => {
                if (!originalImageData || !processedImageData) return;
                const percentage = parseInt(e.target.value) / 100; // 0 = original, 1 = processed
                
                if (percentage === 1) {
                    ctx.putImageData(processedImageData, 0, 0);
                } else if (percentage === 0) {
                    ctx.putImageData(originalImageData, 0, 0);
                } else {
                    ctx.putImageData(originalImageData, 0, 0);
                    
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = canvas.width;
                    tempCanvas.height = canvas.height;
                    tempCanvas.getContext('2d').putImageData(processedImageData, 0, 0);
                    
                    const splitX = canvas.width * (1 - percentage);
                    ctx.drawImage(tempCanvas, splitX, 0, canvas.width - splitX, canvas.height, splitX, 0, canvas.width - splitX, canvas.height);
                    
                    ctx.fillStyle = 'var(--accent-color)';
                    ctx.fillRect(splitX - 1, 0, 2, canvas.height);
                }
            });

            // Reset
            btnReset.addEventListener('click', () => {
                workspace.style.display = 'none';
                uploadArea.style.display = 'flex';
                fileInput.value = '';
                originalImageData = null;
                processedImageData = null;
                filesQueue = [];
            });

            // Download
            btnDownload.addEventListener('click', () => {
                if (!processedImageData) return;
                ctx.putImageData(processedImageData, 0, 0);
                compareSlider.value = 100;
                
                const format = formatSelect.value;
                const ext = format.split('/')[1];
                let quality = 1.0;
                if (format === 'image/jpeg') quality = 0.95;
                
                const dataUrl = canvas.toDataURL(format, quality);
                const link = document.createElement('a');
                link.download = `${currentFilename}_cleaned.${ext}`;
                link.href = dataUrl;
                link.click();
            });

            btnDownloadAll.addEventListener('click', async () => {
                if (filesQueue.length === 0) return;
                
                // Show loading state
                const originalText = btnDownloadAll.innerHTML;
                btnDownloadAll.innerHTML = '⏳ 處理中...';
                btnDownloadAll.disabled = true;
                
                const format = formatSelect.value;
                const ext = format.split('/')[1];
                let quality = 1.0;
                if (format === 'image/jpeg') quality = 0.95;

                for (let i = 0; i < filesQueue.length; i++) {
                    const file = filesQueue[i];
                    await new Promise(resolve => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const img = new Image();
                            img.onload = () => {
                                // Create temporary canvas to process off-screen
                                const tempCanvas = document.createElement('canvas');
                                tempCanvas.width = img.width;
                                tempCanvas.height = img.height;
                                const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
                                tempCtx.drawImage(img, 0, 0);
                                
                                const dataToProcess = tempCtx.getImageData(0, 0, img.width, img.height);
                                const processedData = engine.process(dataToProcess);
                                tempCtx.putImageData(processedData, 0, 0);
                                
                                if (customWatermarkImg) {
                                    applyCustomWatermark(tempCtx, img.width, img.height);
                                }
                                
                                const dataUrl = tempCanvas.toDataURL(format, quality);
                                const link = document.createElement('a');
                                link.download = `${file.name.replace(/\.[^/.]+$/, "")}_cleaned.${ext}`;
                                link.href = dataUrl;
                                link.click();
                                
                                // Small delay to prevent browser from blocking multiple downloads
                                setTimeout(resolve, 300);
                            };
                            img.src = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    });
                }
                
                // Restore button state
                btnDownloadAll.innerHTML = originalText;
                btnDownloadAll.disabled = false;
            });
            
            // --- Custom Watermark Logic ---
            btnCustomWatermark.addEventListener('click', () => customWatermarkInput.click());
            
            customWatermarkInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    const file = e.target.files[0];
                    customWatermarkName.textContent = file.name;
                    btnClearWatermark.style.display = 'inline-block';
                    
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            customWatermarkImg = img;
                            if (originalImage) startProcessing();
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            btnClearWatermark.addEventListener('click', () => {
                customWatermarkInput.value = '';
                customWatermarkImg = null;
                customWatermarkName.textContent = '(無)';
                btnClearWatermark.style.display = 'none';
                if (originalImage) startProcessing();
            });
            
            [customWatermarkPosition, customWatermarkSize, customWatermarkOpacity].forEach(el => {
                el.addEventListener('input', () => {
                    if (originalImage && customWatermarkImg) {
                        // debounce or just re-render
                        startProcessing();
                    }
                });
            });
            
            function applyCustomWatermark(ctxTarget, width, height) {
                if (!customWatermarkImg) return;
                
                const opacity = parseInt(customWatermarkOpacity.value) / 100;
                const sizePercent = parseInt(customWatermarkSize.value) / 100;
                const position = customWatermarkPosition.value;
                
                ctxTarget.globalAlpha = opacity;
                
                let w = width * sizePercent;
                let h = w * (customWatermarkImg.height / customWatermarkImg.width);
                
                let x = 0, y = 0;
                const margin = width * 0.02;
                
                switch(position) {
                    case 'bottom-right': x = width - w - margin; y = height - h - margin; break;
                    case 'bottom-left': x = margin; y = height - h - margin; break;
                    case 'top-right': x = width - w - margin; y = margin; break;
                    case 'top-left': x = margin; y = margin; break;
                    case 'center': x = (width - w) / 2; y = (height - h) / 2; break;
                }
                
                ctxTarget.drawImage(customWatermarkImg, x, y, w, h);
                ctxTarget.globalAlpha = 1.0;
            }
        });
    </script>
</body>
</html>
